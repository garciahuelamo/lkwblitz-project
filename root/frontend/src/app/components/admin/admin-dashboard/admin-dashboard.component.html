<div class="dashboard-container">
  <div class="charts-grid">
    <div class="chart-card">
      <h3>NEW CLIENTS</h3>
      <canvas baseChart #lineChart [data]="lineChartData" [type]="lineChartType"></canvas>
    </div>

    <div class="chart-card">
      <h3>DAILY ORDERS</h3>
      <canvas baseChart #barChart [data]="barChartData" [type]="barChartType"></canvas>
    </div>
  </div>
</div>
