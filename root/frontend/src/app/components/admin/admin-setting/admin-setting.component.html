<main class="main-content">
  <div class="form-container">
    <h2>User Settings</h2>

    <form [formGroup]="userForm">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />

      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />

      <label for="role">Role</label>
      <input id="role" type="text" formControlName="role" />

      <button type="button" (click)="openSaveModal()" [disabled]="userForm.invalid">
        Save Changes
      </button>
    </form>
  </div>
</main>

<!-- Modal -->
<div class="modal-backdrop" *ngIf="modalOpen">
  <div class="modal">
    <h3>Confirm Save</h3>
    <p>Are you sure you want to save the changes for <strong>{{ currentUser?.name }}</strong>?</p>
    <div class="modal-buttons">
      <button class="update" (click)="confirmSave()">Yes, Save</button>
      <button class="cancel" (click)="closeModal()">Cancel</button>
    </div>
  </div>
</div>
