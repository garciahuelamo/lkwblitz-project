<div class="main-content">

  <!-- Search -->
  <input type="text" [(ngModel)]="searchTerm" placeholder="Search user..." (input)="filterUsers()" class="search-input">

  <!-- Users Table -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button class="update" (click)="openEditModal(user)">Edit</button>
          <button class="delete" (click)="openDeleteModal(user)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal POP-UP -->
<div class="modal-backdrop" *ngIf="modalUser">
  <div class="modal">
    <h3>{{ modalAction === 'delete' ? 'Delete User' : 'Edit User' }}</h3>

    <!-- Delete Modal -->
    <div *ngIf="modalAction === 'delete'">
      <p>Are you sure you want to delete user <strong>{{ modalUser.name }}</strong>?</p>
      <div class="modal-buttons">
        <button class="delete" (click)="confirmDeleteUser()">Yes, Delete</button>
        <button class="cancel" (click)="closeModal()">Cancel</button>
      </div>
    </div>

    <!-- Edit Modal -->
    <div *ngIf="modalAction === 'edit'">
      <label>
        Name:
        <input [(ngModel)]="editedUser.name" />
      </label>
      <label>
        Email:
        <input [(ngModel)]="editedUser.email" />
      </label>
      <label>
        Role:
        <input [(ngModel)]="editedUser.role" />
      </label>
      <div class="modal-buttons">
        <button class="update" (click)="saveUser()">Save</button>
        <button class="cancel" (click)="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>
